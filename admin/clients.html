<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="alternate icon" href="../assets/favicon.ico">
  <link rel="apple-touch-icon" href="../assets/favicon-32.png"><title>Clients — Admin</title><link rel="stylesheet" href="../css/style.css"></head>
<body>
<div class="admin-layout">
<aside class="admin-sidebar">
  <div class="sidebar-top">✈ <span>Adrar</span> Admin</div>
  <nav class="sidebar-nav">
    <div class="sb-sect">Principal</div>
    <a href="dashboard.html" class="sb-link">📊 Tableau de bord</a>
    <a href="reservations.html" class="sb-link">📋 Réservations</a>
    <a href="clients.html" class="sb-link active">👥 Clients</a>
    <a href="offres.html" class="sb-link">✈ Offres de voyage</a>
    <div class="sb-sect">Compte</div>
    <a href="#" class="sb-link" onclick="logout()">🚪 Déconnexion</a>
  </nav>
  <div class="sidebar-foot"><div class="sb-user"><div class="sb-av" id="sbAv">A</div><div><div class="sb-name" id="sbName">Admin</div><div class="sb-role" id="sbRole">Administrateur</div></div></div></div>
</aside>
<main class="admin-main">
  <div class="admin-topbar"><h1>Gestion des Clients</h1><div class="topbar-right"><button class="notif"><span>🔔</span><span class="notif-dot"></span></button><a href="../index.html" style="font-size:.82rem;color:var(--primary);font-weight:600">← Site public</a></div></div>
  <div class="admin-content">
    <div class="kpi-row" style="grid-template-columns:repeat(3,1fr)" id="kpis"></div>
    <div class="table-card">
      <div class="table-head">
        <div class="table-title">Annuaire clients</div>
        <div class="table-actions"><input class="filter-in" id="searchC" placeholder="🔍 Nom, email..." oninput="render()"><button class="exp-btn" onclick="exportC()">⬇ CSV</button></div>
      </div>
      <div style="overflow-x:auto"><table class="dt"><thead><tr><th>Client</th><th>Email</th><th>Téléphone</th><th>Ville</th><th>Réservations</th><th>Action</th></tr></thead><tbody id="cBody"></tbody></table></div>
      <div style="padding:.8rem 0;font-size:.8rem;color:var(--muted-fg)" id="cCount"></div>
    </div>
  </div>
</main>
</div>
<div class="modal-overlay" id="mo"><div class="modal"><div class="modal-hd"><div class="modal-title" id="mTitle">Fiche client</div><button class="modal-x" onclick="closeM()">✕</button></div><div id="mBody"></div></div></div>
<script src="../js/main.js"></script>
<script>
if(localStorage.getItem('az_auth')!=='1') location.href='login.html';
const user=JSON.parse(localStorage.getItem('az_user')||'{}');
document.getElementById('sbAv').textContent=(user.name||'A')[0];
document.getElementById('sbName').textContent=user.name||'Admin';
document.getElementById('sbRole').textContent=user.role||'Administrateur';

function buildClients(){
  const res=DB.get('az_reservations');
  const map={};
  res.forEach(r=>{
    if(!map[r.email||r.phone]){map[r.email||r.phone]={name:r.clientName,email:r.email||'',phone:r.phone,city:r.city||'',list:[]};}
    map[r.email||r.phone].list.push(r);
  });
  return Object.values(map);
}
function render(){
  let clients=buildClients();
  const q=document.getElementById('searchC').value.toLowerCase();
  if(q) clients=clients.filter(c=>(c.name+c.email+c.phone+c.city).toLowerCase().includes(q));
  document.getElementById('cCount').textContent=clients.length+' client(s)';
  const res=DB.get('az_reservations');
  document.getElementById('kpis').innerHTML=[
    {lbl:'Total clients',val:buildClients().length,icon:'👥'},
    {lbl:'Clients fréquents (2+)',val:buildClients().filter(c=>c.list.length>=2).length,icon:'⭐'},
    {lbl:'Réservations totales',val:res.length,icon:'📋'},
  ].map(k=>`<div class="kpi"><div><div class="kpi-lbl">${k.lbl}</div><div class="kpi-val">${k.val}</div></div><div style="font-size:1.3rem">${k.icon}</div></div>`).join('');
  document.getElementById('cBody').innerHTML=clients.map(c=>`<tr>
    <td><strong>${c.name}</strong></td>
    <td style="font-size:.82rem">${c.email||'—'}</td>
    <td style="font-size:.82rem">${c.phone}</td>
    <td>${c.city||'—'}</td>
    <td><span style="background:var(--secondary);padding:2px 10px;border-radius:12px;font-weight:700;font-size:.83rem">${c.list.length}</span></td>
    <td><button class="btn-a ba-view" onclick="viewC('${encodeURIComponent(c.email||c.phone)}')">👁 Voir</button></td>
  </tr>`).join('');
}
function viewC(key){
  const clients=buildClients();
  const c=clients.find(x=>encodeURIComponent(x.email||x.phone)===key);
  if(!c) return;
  document.getElementById('mTitle').textContent=c.name;
  document.getElementById('mBody').innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-bottom:1.2rem">
      ${[['Email',c.email||'—'],['Téléphone',c.phone],['Ville',c.city||'—'],['Réservations',c.list.length]].map(([l,v])=>`<div style="background:var(--secondary);padding:.8rem;border-radius:var(--radius)"><div style="font-size:.7rem;color:var(--muted-fg);margin-bottom:2px">${l}</div><div style="font-weight:600;font-size:.87rem">${v}</div></div>`).join('')}
    </div>
    <div style="font-weight:700;margin-bottom:.7rem;color:var(--primary)">Historique des réservations</div>
    <div style="display:flex;flex-direction:column;gap:.5rem;max-height:280px;overflow-y:auto">
      ${c.list.map(r=>`<div style="background:var(--secondary);border-radius:var(--radius);padding:.8rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap">
        <div><div style="font-weight:600;font-size:.85rem">${r.offer}</div><div style="font-size:.73rem;color:var(--muted-fg)">${typeLabel(r.type)} · ${r.createdAt}</div></div>
        <div>${statusBadge(r.status)}</div>
      </div>`).join('')}
    </div>`;
  openM();
}
function exportC(){
  const clients=buildClients();
  const h=['Nom','Email','Téléphone','Ville','Réservations'];
  const rows=clients.map(c=>[c.name,c.email||'',c.phone,c.city||'',c.list.length].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','));
  const csv=[h.join(','),...rows].join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);a.download='clients_adrar.csv';a.click();
}
function openM(){document.getElementById('mo').classList.add('open');}
function closeM(){document.getElementById('mo').classList.remove('open');}
document.getElementById('mo').addEventListener('click',e=>{if(e.target===e.currentTarget)closeM();});
function logout(){localStorage.removeItem('az_auth');localStorage.removeItem('az_user');location.href='login.html';}
render();
</script>
</body>
</html>
